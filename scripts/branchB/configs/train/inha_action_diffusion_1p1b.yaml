# branch B — DynamiCrafter 1.1B 폭 액션조건 3D UNet 학습 config
#
# 출처: open/baseline/challenge_kit/configs/train/inha_action_diffusion_11M.yaml 를 복사한 뒤
#       _thinking/model_select/009-branchB_execution_spec.md §2 표의 **7키만** 변경했다.
#       (표 외 변경은 아래 "표 외 변경" 주석 3건뿐이며 모두 이유를 명시했다.)
#
# 경로 규칙(008 §8.6 함정 9): 절대경로를 박지 않는다. `__REPO__` 는 실행 시 저장소 루트로 치환된다.
#       치환 주체: scripts/branchB/cfg_paths.py (런처·검증 스크립트가 공용으로 사용)
#       치환 없이 이 파일을 그대로 쓰면 `__REPO__` 디렉터리가 생기며 즉시 눈에 띈다(무해·의도적).

name: inha_action_diffusion_1p1b
group: inha_action_diffusion_1p1b
logdir: __REPO__/artifacts/branchB/train_out

data:
  target: ldwma.lightning.data_modules.lerobot_so100.SO100DataModule
  params:
    root: __REPO__/open/data/train
    remote: False
    dataset_paths: auto
    action_stats_path: __REPO__/open/data/train/so100_action_statistics.json
    normalize_actions: True
    batch_size: 1
    num_workers: 2
    pin_memory: True
    target_height: 320
    target_width: 512
    pad: True
    camera_key: auto
    traj_len: 16
    val_fraction: 0.05
    downsample: 1
    use_language: False

model:
  pretrained_checkpoint: __REPO__/open/baseline/checkpoints/backbone.ckpt
  # [표 외 변경 없음] baseline 그대로 유지한다. 여기에 "model.diffusion_model" 을 넣으면 안 된다:
  #   load_checkpoints() 는 필터 후 model.load_state_dict(strict=False) 를 호출하고,
  #   strict=False 여도 **shape 불일치는 RuntimeError 로 터진다**(time_embed.2 2키가 그렇다).
  #   그래서 UNet 로드는 런처가 담당한다 — M3 Part B 와 동일한 warm-start 패턴 +
  #   shape 불일치 키 사전 제거. 검증: scripts/branchB/verify_1p1b_load.py
  only_reload_modules:
    ["first_stage_model", "cond_stage_model", "embedder", "image_proj_model"]
  base_learning_rate: 1e-4     # 11M 값 그대로. 1.46B warm-start 에 적정한지는 S4 스모크에서 판단할 항목
  scale_lr: False
  target: lvdm.models.ddpm3d.LatentVisualDiffusion
  params:
    save_only_unet: True
    linear_warmup_steps: 250
    rescale_betas_zero_snr: True
    parameterization: "v"
    linear_start: 0.00085
    linear_end: 0.012
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: video
    cond_stage_key: caption
    cond_stage_trainable: False
    image_proj_model_trainable: False
    conditioning_key: hybrid
    image_size: [40, 64]
    channels: 4
    scale_by_std: False
    scale_factor: 0.18215
    use_ema: True
    uncond_prob: 0.05
    uncond_type: "empty_seq"
    rand_cond_frame: false
    use_dynamic_rescale: true
    base_scale: 0.7
    fps_condition_type: "fps"   # 데이터셋 info.json 의 fps 가 그대로 fs 로 들어간다(우리 데이터=6)
    perframe_ae: True

    unet_config:
      target: lvdm.modules.networks.openaimodel3d.UNetModel
      params:
        action_conditioned: True
        action_dims: 6
        action_dropout_prob: 0.1     # <<< [7키-7] baseline 0.0 → 0.1. 액션 CFG 유효화(008 §8.4)
        use_scale_shift_norm: False   # <<< [7키-5] baseline True → False. 핵심: emb 출력 2배 문제 해소(96.36%→99.89%)
        in_channels: 8
        out_channels: 4
        model_channels: 320           # <<< [7키-1] 32 → 320 (DC 1.1B 규격)
        attention_resolutions:        # <<< [7키-3] [4,2] → [4,2,1]
          - 4
          - 2
          - 1
        num_res_blocks: 2
        channel_mult:                # <<< [7키-2] [1,2,3] → [1,2,4,4]
          - 1
          - 2
          - 4
          - 4
        dropout: 0.1
        num_head_channels: 64        # <<< [7키-4] 16 → 64 (→ UNet 1462.6M)
        transformer_depth: 1
        context_dim: 1024
        use_linear: true
        use_checkpoint: True
        temporal_conv: True
        temporal_attention: True
        temporal_selfatt_only: true
        use_relative_position: false
        use_causal_attention: False
        temporal_length: 16
        addition_attention: true
        image_cross_attention: true
        default_fs: 10               # 학습 시에는 미사용(배치의 fps=6 이 우선). fs 미지정 추론 때만 쓰이는 fallback
        fs_condition: True           # <<< [7키-6] false → True. DC 사전학습 fps_embedding 4키 흡수 + 6fps 조건화

    first_stage_config:
      target: lvdm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        monitor: val/rec_loss
        ddconfig:
          double_z: True
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
            - 1
            - 2
            - 4
            - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

    cond_stage_config:
      target: lvdm.modules.encoders.condition.FrozenOpenCLIPEmbedder
      params:
        freeze: true
        layer: "penultimate"
        version: null    # [표 외 변경 1] open_clip ViT-H(3.9GB) 재다운로드 회피(함정 6). 실가중치는 backbone 에서 로드

    img_cond_stage_config:
      target: lvdm.modules.encoders.condition.FrozenOpenCLIPImageEmbedderV2
      params:
        freeze: true
        version: null    # [표 외 변경 1] 동일

    image_proj_stage_config:
      target: lvdm.modules.encoders.resampler.Resampler
      params:
        dim: 1024
        depth: 4
        dim_head: 64
        heads: 12
        num_queries: 16
        embedding_dim: 1280
        output_dim: 1024
        ff_mult: 4
        video_length: 16

lightning:
  precision: 16
  trainer:
    strategy: ddp
    accelerator: "gpu"
    limit_train_batches: 1.0
    limit_val_batches: 2
    check_val_every_n_epoch: 2
    num_sanity_val_steps: 0
    num_nodes: 1
    benchmark: True
    accumulate_grad_batches: 2
    max_steps: 200000            # 시간 상한이 실제 종료 조건. 스텝은 사실상 무제한으로 둔다
    max_time: "03:04:00:00"      # 76h = 4일(96h) 예산의 79% (009 §3 "wall-clock 의 80%")
    log_every_n_steps: 10
    gradient_clip_algorithm: "norm"
    gradient_clip_val: 1.0
    logger:
      target: pytorch_lightning.loggers.CSVLogger
      params:
        save_dir: __REPO__/artifacts/branchB/train_out/logs/
        name: inha_action_diffusion_1p1b
  callbacks:
    # [표 외 변경 2] 체크포인트를 2단으로 나눈다. 이유는 순수 물리 제약이다:
    #   save_only_unet=True 는 `model.*` + `model_ema.*` 를 저장한다 → 1462.6M × 2 × 4B ≈ **11.7GB/개**.
    #   11M(87MB)에서 쓰던 "every 500 + save_top_k=-1" 을 그대로 두면 4일 학습에 수십 TB가 필요하다.
    #   그리고 PL 1.9 는 monitor 가 없을 때 save_top_k=1 만 이전 파일을 지운다(2 이상·-1 은 전부 보존).
    #   → 롤링(끊김 대비, 용량 유한) + 영구 아카이브(삭제 금지 규칙) 로 분리한다.
    #   ※ 최종 주기는 S4 에서 s/it 실측 후 확정한다(아래는 안전한 초기값).
    model_checkpoint:            # 롤링: 500스텝마다. 이전 것을 지우므로 상시 2개(~23GB) 유지
      target: pytorch_lightning.callbacks.ModelCheckpoint
      params:
        filename: "{epoch}-{step}"
        save_weights_only: True
        every_n_train_steps: 500
        save_top_k: 1
        save_last: True
    metrics_over_trainsteps_checkpoint:   # 영구 아카이브: 지우지 않는다(save_top_k=-1)
      target: pytorch_lightning.callbacks.ModelCheckpoint
      params:
        filename: "{epoch}-{step}"
        save_weights_only: True
        every_n_train_steps: 5000
        save_top_k: -1
