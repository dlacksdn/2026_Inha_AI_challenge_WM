name: inha_action_diffusion_11M_m3
group: inha_action_diffusion_11M_m3
# 출력은 반드시 dlacksdn(repo) 내부에! baseline의 ../outputs 는 심링크로 dlacksdn 밖(inha_challenge_datasets)이므로 금지.
logdir: /home/rils/dlacksdn/2026_Inha_AI_challenge_WM/artifacts/m3/train_out

data:
  target: ldwma.lightning.data_modules.lerobot_so100.SO100DataModule
  params:
    root: /home/rils/dlacksdn/2026_Inha_AI_challenge_WM/open/data/train   # 프로젝트 canonical(~/다운로드/train), 홀드아웃과 동일 데이터
    remote: False
    dataset_paths: auto
    action_stats_path: /home/rils/dlacksdn/2026_Inha_AI_challenge_WM/open/data/train/so100_action_statistics.json
    normalize_actions: True
    batch_size: 1
    num_workers: 2
    pin_memory: True
    target_height: 320
    target_width: 512
    pad: True
    camera_key: auto
    traj_len: 16
    val_fraction: 0.05
    downsample: 1
    use_language: False

model:
  pretrained_checkpoint: /home/rils/dlacksdn/2026_Inha_AI_challenge_WM/open/baseline/checkpoints/backbone.ckpt
  only_reload_modules:
    ["first_stage_model", "cond_stage_model", "embedder", "image_proj_model"]
  base_learning_rate: 1e-4
  scale_lr: False
  target: lvdm.models.ddpm3d.LatentVisualDiffusion
  params:
    save_only_unet: True
    linear_warmup_steps: 250
    rescale_betas_zero_snr: True
    parameterization: "v"
    linear_start: 0.00085
    linear_end: 0.012
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: video
    cond_stage_key: caption
    cond_stage_trainable: False
    image_proj_model_trainable: False
    conditioning_key: hybrid
    image_size: [40, 64]
    channels: 4
    scale_by_std: False
    scale_factor: 0.18215
    use_ema: True
    uncond_prob: 0.05
    uncond_type: "empty_seq"
    rand_cond_frame: false
    use_dynamic_rescale: true
    base_scale: 0.7
    fps_condition_type: "fps"
    perframe_ae: True

    unet_config:
      target: lvdm.modules.networks.openaimodel3d.UNetModel
      params:
        action_conditioned: True
        action_dims: 6
        action_dropout_prob: 0.1        # <<< M3 Part B: 액션 CFG를 위해 켬 (baseline=0.0)
        use_scale_shift_norm: True
        in_channels: 8
        out_channels: 4
        model_channels: 32
        attention_resolutions:
          - 4
          - 2
        num_res_blocks: 2
        channel_mult:
          - 1
          - 2
          - 3
        dropout: 0.1
        num_head_channels: 16
        transformer_depth: 1
        context_dim: 1024
        use_linear: true
        use_checkpoint: True
        temporal_conv: True
        temporal_attention: True
        temporal_selfatt_only: true
        use_relative_position: false
        use_causal_attention: False
        temporal_length: 16
        addition_attention: true
        image_cross_attention: true
        default_fs: 10
        fs_condition: false

    first_stage_config:
      target: lvdm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        monitor: val/rec_loss
        ddconfig:
          double_z: True
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
            - 1
            - 2
            - 4
            - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

    cond_stage_config:
      target: lvdm.modules.encoders.condition.FrozenOpenCLIPEmbedder
      params:
        freeze: true
        layer: "penultimate"
        version: null          # <<< open_clip 다운로드 회피(학습 시에도). only_reload_modules 가 backbone에서 실가중치 로드. CLIP은 frozen.

    img_cond_stage_config:
      target: lvdm.modules.encoders.condition.FrozenOpenCLIPImageEmbedderV2
      params:
        freeze: true
        version: null          # <<< 동일

    image_proj_stage_config:
      target: lvdm.modules.encoders.resampler.Resampler
      params:
        dim: 1024
        depth: 4
        dim_head: 64
        heads: 12
        num_queries: 16
        embedding_dim: 1280
        output_dim: 1024
        ff_mult: 4
        video_length: 16

lightning:
  precision: 16
  trainer:
    strategy: ddp
    accelerator: "gpu"
    limit_train_batches: 1.0
    limit_val_batches: 2
    check_val_every_n_epoch: 2
    num_sanity_val_steps: 0
    num_nodes: 1
    benchmark: True
    accumulate_grad_batches: 2
    max_steps: 6000                 # <<< 시간박스 (dotlist 로 재정의 가능)
    max_time: "00:03:30:00"         # <<< 안전 상한 3h30m
    log_every_n_steps: 10
    gradient_clip_algorithm: "norm"
    gradient_clip_val: 1.0
    logger:
      target: pytorch_lightning.loggers.CSVLogger
      params:
        save_dir: /home/rils/dlacksdn/2026_Inha_AI_challenge_WM/artifacts/m3/train_out/logs/
        name: inha_action_diffusion_11M_m3
  callbacks:
    model_checkpoint:
      target: pytorch_lightning.callbacks.ModelCheckpoint
      params:
        filename: "{epoch}-{step}"
        save_weights_only: True
        every_n_train_steps: 500     # <<< 촘촘 체크포인트 (중간 끊김 대비)
        save_top_k: -1
        save_last: True
