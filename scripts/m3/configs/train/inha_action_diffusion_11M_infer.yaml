# M3 추론용 모델 config = stock inha_action_diffusion_11M.yaml 의 아키텍처와 동일.
# 유일한 차이: cond_stage_config / img_cond_stage_config 에 version: null 을 넣어
#   open_clip ViT-H-14(~3.9GB) 다운로드를 회피한다(랜덤 빌드 후 backbone.ckpt 가 실가중치로 덮어씀).
# (M1 measure_1p1b.py 와 동일한 검증된 트릭.) action_dropout_prob 은 추론에 무관하므로 baseline 0.0 유지.
model:
  pretrained_checkpoint: /home/rils/dlacksdn/2026_Inha_AI_challenge_WM/open/baseline/checkpoints/backbone.ckpt
  only_reload_modules:
    ["first_stage_model", "cond_stage_model", "embedder", "image_proj_model"]
  base_learning_rate: 1e-4
  scale_lr: False
  target: lvdm.models.ddpm3d.LatentVisualDiffusion
  params:
    save_only_unet: True
    linear_warmup_steps: 250
    rescale_betas_zero_snr: True
    parameterization: "v"
    linear_start: 0.00085
    linear_end: 0.012
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: video
    cond_stage_key: caption
    cond_stage_trainable: False
    image_proj_model_trainable: False
    conditioning_key: hybrid
    image_size: [40, 64]
    channels: 4
    scale_by_std: False
    scale_factor: 0.18215
    use_ema: True
    uncond_prob: 0.05
    uncond_type: "empty_seq"
    rand_cond_frame: false
    use_dynamic_rescale: true
    base_scale: 0.7
    fps_condition_type: "fps"
    perframe_ae: True

    unet_config:
      target: lvdm.modules.networks.openaimodel3d.UNetModel
      params:
        action_conditioned: True
        action_dims: 6
        action_dropout_prob: 0.0
        use_scale_shift_norm: True
        in_channels: 8
        out_channels: 4
        model_channels: 32
        attention_resolutions:
          - 4
          - 2
        num_res_blocks: 2
        channel_mult:
          - 1
          - 2
          - 3
        dropout: 0.1
        num_head_channels: 16
        transformer_depth: 1
        context_dim: 1024
        use_linear: true
        use_checkpoint: True
        temporal_conv: True
        temporal_attention: True
        temporal_selfatt_only: true
        use_relative_position: false
        use_causal_attention: False
        temporal_length: 16
        addition_attention: true
        image_cross_attention: true
        default_fs: 10
        fs_condition: false

    first_stage_config:
      target: lvdm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        monitor: val/rec_loss
        ddconfig:
          double_z: True
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
            - 1
            - 2
            - 4
            - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

    cond_stage_config:
      target: lvdm.modules.encoders.condition.FrozenOpenCLIPEmbedder
      params:
        freeze: true
        layer: "penultimate"
        version: null          # <<< 다운로드 회피 (backbone.ckpt 로 실가중치 로드)

    img_cond_stage_config:
      target: lvdm.modules.encoders.condition.FrozenOpenCLIPImageEmbedderV2
      params:
        freeze: true
        version: null          # <<< 다운로드 회피

    image_proj_stage_config:
      target: lvdm.modules.encoders.resampler.Resampler
      params:
        dim: 1024
        depth: 4
        dim_head: 64
        heads: 12
        num_queries: 16
        embedding_dim: 1280
        output_dim: 1024
        ff_mult: 4
        video_length: 16
